; @inv SCUM 1.3.0 (CL-119181) enabled Unlimited Bone Influences for skeletal meshes,
; so they render with the TGPUSkinVertexFactoryUnlimited shader VF. Our materials must
; compile that permutation or any skeletal mesh using them crashes the 1.3.0 client
; (EXCEPTION_ACCESS_VIOLATION, "Incomplete material ... missing Vertex Factory
; TGPUSkinVertexFactoryUnlimited"). @brk drop this and re-cooked content crashes on 1.3.0.
[/Script/Engine.RendererSettings]
r.GPUSkin.UnlimitedBoneInfluences=True
r.GPUSkin.Limit2BoneInfluences=False
