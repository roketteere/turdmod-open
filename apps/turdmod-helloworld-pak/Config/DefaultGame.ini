[/Script/UnrealEd.ProjectPackagingSettings]
; @inv bShareMaterialShaderCode=False forces the cooker to serialize each
; material's shadermap INLINE into its package (.uexp) instead of into a
; separate ShaderArchive-*.ushaderbytecode library. SCUM won't open our
; shader library, so inline is the only way a runtime-applied custom
; material (M_PRFlag / M_YOUR_OWNER_NAME) gets real shaders instead of the grey
; default. @brk flip this True and the livery renders default-grey again.
bShareMaterialShaderCode=False
bSharedMaterialNativeLibraries=False
