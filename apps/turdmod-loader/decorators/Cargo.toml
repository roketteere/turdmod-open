[package]
name = "turdmod-rich-decorators"
version = "0.1.0"
edition = "2021"
description = "Minimal DLL: function-detours SCUM's engine-stock URichTextBlock decorator classes to add <img src='url'/>, <a href='...'/>, and <dismiss key='...'/> rendering. Sibling to the kitchen-sink turdmod-loader; intentionally small and auditable."
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "turdmod_rich_decorators"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
] }
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
url = "2"
retour = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
