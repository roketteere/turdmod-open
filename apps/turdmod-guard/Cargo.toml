[package]
name = "turdmod-guard"
version = "0.1.0"
edition = "2021"
description = "Anti-cheat detection daemon for TurdMOD-enabled SCUM private servers."
license = "MIT"

[[bin]]
name = "turdmod-guard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
once_cell = "1"
parking_lot = "0.12"
ureq = { version = "2", features = ["json"] }
